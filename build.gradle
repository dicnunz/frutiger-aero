plugins { id 'fabric-loom' version '1.8.13' }
version = '2.0.0'
group = 'dev.aero'
base { archivesName = 'frutiger-aero' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.5'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.105.0+1.21.1'
 modRuntimeOnly files('dependencies/iris-fabric-1.8.7+mc1.21.1.jar')
 modRuntimeOnly files('dependencies/sodium-fabric-0.6.9+mc1.21.1.jar')
 runtimeOnly fileTree('dependencies/iris-libs') { include '*.jar' }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar() }
tasks.named('sourcesJar') { from('LICENSE') { into 'licenses/aero' } }
processResources { from('LICENSE') { into 'licenses/aero' } }
loom { runs { client {
 runDir 'run'
 vmArg '-Daero.launch=true'
 vmArg '-Xmx3G'
 programArg '--username'; programArg 'AeroVisitor'
 if(project.hasProperty('demo')) vmArg '-Daero.demo=true'
 if(project.hasProperty('fresh')) vmArg '-Daero.fresh=true'
} } }
